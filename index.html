<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Jumat Kliwon</title>
		<meta charset="utf-8">
		<meta content="Page Description" name="description">
		<meta content="notranslate" name="google">
		<meta content="yes" name="mobile-web-app-capable">
		<meta content="yes" name="apple-mobile-web-app-capable">
		<meta content="#FFFFFF" name="theme-color" media="(prefers-color-scheme: light)">
		<meta content="#1E1E1E" name="theme-color" media="(prefers-color-scheme: dark)">
		<meta content="width=device-width,initial-scale=1,maximum-scale=1,shrink-to-fit=no,user-scalable=0,viewport-fit=cover" name="viewport">
		<meta content="#FFFFFF" name="theme-color">
		<meta name="msapplication-navbutton-color" content="#FFFFFF">
		<meta name="apple-mobile-web-app-status-bar-style" content="white">
		<meta name="color-scheme" content="light">	
		<meta content="telephone=no" name="format-detection">
		<style>
			html {-webkit-text-size-adjust:100%}
			body {font-family:arial;font-size:1vw;text-align:center;margin-top:30vh}
			@media screen and (min-width: 1001px), screen and (pointer: coarse), screen and (hover: none) {body{font-size:4vh;}}
			@media screen and (max-width: 1000px) {body{font-size:2.2vh;}}
			@media (prefers-color-scheme: dark) {body {background-color:#1E1E1E;color:#299ED6}}
		</style>
	</head>
	<body>
		<script>
			// Base date: 12 June 2026 = Friday Kliwon
			const baseDate = new Date("2026-06-12");
			baseDate.setHours(0, 0, 0, 0);
			const today = new Date();
			today.setHours(0, 0, 0, 0);
			
			const weekdays = ["Minggu", "Senin", "Selasa", "Rabu","Kamis", "Jumat", "Sabtu"];
			const pasaran = ["Kliwon", "Legi", "Pahing", "Pon", "Wage"];
			
			const diffToday = Math.floor((today - baseDate) / 86400000);
			const wetonToday = weekdays[today.getDay()] + " " + pasaran[((diffToday % 5) + 5) % 5];
			let nextFridayKliwon = new Date(today);

			while (true) {
				const diffDays = Math.floor((nextFridayKliwon - baseDate) / 86400000);
				const isFriday = nextFridayKliwon.getDay() === 5; //jumat
				const isKliwon = pasaran[((diffDays % 5) + 5) % 5] === "Kliwon"; //kliwon
				if (isFriday && isKliwon) {
					if (nextFridayKliwon > today) break;
				}
				nextFridayKliwon.setDate(nextFridayKliwon.getDate() + 1);
			}
			const daysUntil = Math.floor((nextFridayKliwon - today) / 86400000);

			document.write("Hari ini " + today.toLocaleDateString("id-ID", {day: "numeric",month: "long",year: "numeric"}) + " adalah<br><b>"+wetonToday+"</b><br>");
			document.write('<br>Jumat Kliwon berikutnya: ')
			document.write(daysUntil + ' hari lagi.');
			document.write('<br>');
			document.write(nextFridayKliwon.toLocaleDateString("id-ID", {day: "numeric",month: "long",year: "numeric"}));
		</script>
    </body>
</html>
